name: Origin verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: origin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Chromium for browser acceptance
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Verify development and production browser lifecycles
        if: runner.os == 'Linux'
        run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
